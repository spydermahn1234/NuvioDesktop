name: Nuvio Lights

# Builds Nuvio Lights (lights/), the Windows tray app that dims WiZ and Govee lights while Nuvio plays, and publishes
# NuvioLights.exe as the rolling "NuvioLights" prerelease. A prerelease under its own tag, like NuvioRemote, so the
# desktop updater (which reads /releases/latest and "Nightly") never mistakes it for a Nuvio build.
# .NET cross-compiles the Windows exe on Linux, so this runs on ubuntu.

on:
  workflow_dispatch:
  push:
    branches: [Spyder]
    paths:
      - 'lights/**'
      - '.github/workflows/nuvio-lights.yml'

concurrency:
  group: nuvio-lights-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lights
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test tests/NuvioLights.Tests

      - name: Build NuvioLights.exe
        run: >
          dotnet publish src/NuvioLights -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=1.0.${{ github.run_number }}
          -o out

      - uses: actions/upload-artifact@v4
        with:
          name: NuvioLights
          path: lights/out/NuvioLights.exe

      - name: Publish NuvioLights release
        if: github.ref == 'refs/heads/Spyder'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --short HEAD)
          gh release delete NuvioLights --cleanup-tag --yes 2>/dev/null || true
          gh release create NuvioLights out/NuvioLights.exe \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Nuvio Lights (Spyder $sha)" \
            --notes "Tray app that dims WiZ and Govee lights while Nuvio plays. Build ${{ github.run_number }}. Download NuvioLights.exe on the HTPC and run it; see lights/README.md. In Nuvio, turn on Settings > Keyboard shortcuts > Phone remote."
