name: Claude check

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']

# A newer push makes an older run's result irrelevant: stop it instead of queueing two 20-minute builds.
concurrency:
  group: claude-check-${{ github.ref }}
  cancel-in-progress: true

# Branch-only check (CLAUDE.md): compiles and runs the gating tests; publishes nothing.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # services.gradle.org occasionally drops the TLS handshake on hosted runners.
      # Download the wrapper distribution up front with retries so a blip doesn't fail the job.
      - name: Warm up Gradle wrapper (retry)
        shell: pwsh
        # services.gradle.org hands the zip on to GitHub's release servers, which time out (504) at times. A mirror is tried
        # too, alternating with the official address. Safe because gradle-wrapper.properties pins distributionSha256Sum: the
        # wrapper refuses any download that is not byte for byte the official Gradle zip. Only this checkout's copy of the
        # properties is rewritten; nothing is committed.
        run: |
          $props = 'gradle/wrapper/gradle-wrapper.properties'
          if (-not (Select-String -Path $props -Pattern '^distributionSha256Sum=[0-9a-f]{64}$' -Quiet)) { throw "distributionSha256Sum must be pinned before a mirror is used" }
          $official = (Select-String -Path $props -Pattern '^distributionUrl=(.*)$').Matches[0].Groups[1].Value
          $zip = [regex]::Match($official, 'gradle-[0-9.]+-bin\.zip').Value
          $sources = @($official, "https\://mirrors.cloud.tencent.com/gradle/$zip")
          $ok = $false
          foreach ($i in 1..6) {
            $url = $sources[($i - 1) % $sources.Count]
            (Get-Content $props) -replace '^distributionUrl=.*$', "distributionUrl=$url" | Set-Content $props
            Write-Host "Gradle from $url"
            ./gradlew.bat --version
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Gradle wrapper download failed (attempt $i/6); retrying in $($i * 5)s"
            Start-Sleep -Seconds ($i * 5)
          }
          if (-not $ok) { throw "Could not download the Gradle wrapper after 6 attempts" }

      # libmpv + ffmpeg DLLs. The build auto-detects C:/msys64/ucrt64/bin, which the
      # runner image already has; we only need to install mpv into it.
      - name: Install libmpv (MSYS2)
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm"
          # gcc compiles the patched libquickjs.dll (buildWindowsQuickJs); mpv does not pull it in.
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-ninja"
          if (-not (Test-Path C:\msys64\ucrt64\bin\libmpv-2.dll)) { throw "libmpv-2.dll missing after install" }
          if (-not (Test-Path C:\msys64\ucrt64\bin\gcc.exe)) { throw "gcc.exe missing after install" }

      # fork:live-tv-subtitles - whisper.cpp beside the checkout, where buildWindowsWhisper looks for it, so the app ships
      # nuvio_whisper.dll (voice control, and Live TV's subtitle word match). Pinned to the tag build.gradle.kts expects;
      # a failed whisper build only warns (-Pnuvio.engine.optional=true).
      - name: Fetch whisper.cpp
        shell: pwsh
        run: |
          $dir = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "whisper.cpp"
          if (-not (Test-Path (Join-Path $dir "include/whisper.h"))) {
            git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp $dir
          }

      # WebView2 SDK headers + loader, needed to compile player_bridge.dll.
      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\libs | Out-Null
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2 -OutFile C:\libs\webview2.zip
          Expand-Archive C:\libs\webview2.zip -DestinationPath C:\libs\webview2 -Force
          if (-not (Test-Path C:\libs\webview2\build\native\include\WebView2.h)) { throw "WebView2.h missing" }

      # --no-configuration-cache -I .github/mirror.init.gradle on every Gradle step here: storing the configuration cache fails now and then on CI
      # ("Configuration cache state could not be cached", a Kotlin classpath snapshot provider), failing the build before
      # anything compiles. Each run configures from scratch anyway, so CI loses nothing by not storing it. Local builds keep it.
      # downloadWix=false on the test and portable steps: WiX only makes the MSI (its own step below), and its download from
      # GitHub's release servers times out (504) at times.
      # innertubex=true here too, the same as the distributable below: a different value changes the
      # compiled sources, so the two steps would each compile the whole app instead of sharing one compile.
      - name: Unit tests (music, pre-show, network, phone remote, tonight, local addons, live scores)
        shell: pwsh
        env:
          WIX_PATH: ${{ runner.temp }}\wix-unused
        run: >
          $ErrorActionPreference = 'Continue';
          New-Item -ItemType Directory -Force $env:WIX_PATH | Out-Null;
          ./gradlew.bat :composeApp:desktopTest --no-configuration-cache "-Pcompose.desktop.application.downloadWix=false" -I .github/mirror.init.gradle
          --tests "com.nuvio.app.features.music.*"
          --tests "com.nuvio.app.features.preroll.*"
          --tests "com.nuvio.app.core.network.*"
          --tests "com.nuvio.app.features.remote.*"
          --tests "com.nuvio.app.features.tonight.*"
          --tests "com.nuvio.app.features.localaddons.*"
          --tests "com.nuvio.app.features.livescores.*"
          --tests "com.nuvio.app.features.lights.*"
          --tests "com.nuvio.app.features.home.LiveTvHomeRowTest"
          --tests "com.nuvio.app.features.home.shelves.*"
          --tests "com.nuvio.app.features.watchalong.*"
          --tests "com.nuvio.app.features.auditorium.*"
          --tests "com.nuvio.app.features.settings.DesktopSettingsGroupHeadingsTest"
          --tests "*Trivia*"
          --tests "com.nuvio.app.features.iptv.IptvOnNowTest"
          --tests "com.nuvio.app.features.iptv.IptvChannelMergeTest"
          --tests "com.nuvio.app.features.iptv.IptvMergedPlaybackTest"
          --tests "com.nuvio.app.features.iptv.IptvTriageTest"
          --tests "com.nuvio.app.features.iptv.IptvLineupTest"
          --tests "com.nuvio.app.features.iptv.IptvDepartureTest"
          --tests "com.nuvio.app.features.iptv.IptvDecideTest"
          --tests "com.nuvio.app.features.iptv.IptvBrakesTest"
          --tests "com.nuvio.app.features.iptv.IptvEveningTest"
          --tests "com.nuvio.app.features.iptv.IptvWeedTest"
          --tests "com.nuvio.app.features.iptv.IptvProgrammeLineTest"
          --tests "com.nuvio.app.features.iptv.IptvStageTest"
          --tests "com.nuvio.app.features.iptv.IptvFrontDoorTest"
          --tests "com.nuvio.app.features.iptv.IptvGuideTextTest"
          --tests "com.nuvio.app.features.iptv.IptvTasteTest"
          --tests "com.nuvio.app.features.iptv.IptvAskAiTest"
          --tests "com.nuvio.app.features.iptv.IptvOnDemandTest"
          --tests "com.nuvio.app.features.iptv.IptvOnDemandEpisodeTest"
          --tests "com.nuvio.app.features.iptv.IptvRegionsTest"
          --tests "com.nuvio.app.features.iptv.IptvLanguagesTest"
          --tests "com.nuvio.app.features.iptv.IptvTeamsTest"
          --tests "com.nuvio.app.features.iptv.IptvSportArtTest"
          --tests "com.nuvio.app.features.iptv.IptvViewsTest"
          --tests "com.nuvio.app.features.player.audiosync.LiveAudioSubtitleSyncTest"
          --tests "com.nuvio.app.features.player.audiosync.LiveWordMatchTest"
          "-Pnuvio.innertubex=true"
          "-Pnuvio.webview2.dir=C:/libs/webview2"
          "-Pnuvio.windows.libmpv.runtimeDir=C:/msys64/ucrt64/bin"
          "-Pnuvio.windows.allowWhisperAvfilter=true"
          "-Pnuvio.windows.bundleFullRuntime=true"
          "-Pnuvio.engine.optional=true"
          2>&1 | Tee-Object -FilePath gradle-check.log

      # The cloud session that pushes this branch cannot read logs, only check-run annotations: lift the compiler errors
      # and failed tests into annotations.
      - name: Errors as annotations
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path gradle-check.log) {
            Select-String -Path gradle-check.log -Pattern '^e: |^w: .*auditorium|What went wrong|FAILED|Exception' | Select-Object -First 45 | ForEach-Object { Write-Host ("::error::" + ($_.Line -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')) }
          }
          $files = Get-ChildItem -Path composeApp/build/test-results -Recurse -Filter *.xml -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            [xml]$x = Get-Content -LiteralPath $f.FullName
            foreach ($c in $x.testsuite.testcase) {
              $fail = if ($c.failure) { $c.failure } elseif ($c.error) { $c.error } else { $null }
              if ($fail) { $m = ("$($c.classname).$($c.name): " + $fail.message) -replace "`r",'' -replace "`n",' '; Write-Host ("::error::" + $m.Substring(0, [Math]::Min(900, $m.Length))) }
            }
          }

      - name: Failed tests (summary)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path composeApp/build/test-results -Recurse -Filter *.xml -ErrorAction SilentlyContinue
          $total = 0; $failed = @()
          foreach ($f in $files) {
            [xml]$x = Get-Content -LiteralPath $f.FullName
            foreach ($c in $x.testsuite.testcase) {
              $total++
              if ($c.failure -or $c.error) { $failed += "$($c.classname).$($c.name)" }
            }
          }
          $lines = @("### Unit tests: $($failed.Count) failed of $total run (full suite, not blocking)")
          if ($failed.Count -gt 0) {
            $lines += ""
            $groups = $failed | Group-Object { ($_ -split '\.')[0..5] -join '.' } | Sort-Object Count -Descending
            foreach ($g in $groups) { $lines += "- **$($g.Name)**: $($g.Count)" }
            $lines += ""
            $lines += ($failed | Select-Object -First 200 | ForEach-Object { "- ``$_``" })
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $lines | ForEach-Object { Write-Host $_ }

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: composeApp/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

      # fork:screen-changelog - the tests above already draw screens and save PNGs (build/test-screenshots and a few
      # previews). Keep them: the screen-changelog job below compares them with the last build's and makes a before/after reel.
      - name: Collect screen gallery
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force screens | Out-Null
          foreach ($d in @('composeApp/build/test-screenshots', 'composeApp/build/test-artifacts', 'composeApp/build')) {
            if (Test-Path $d) { Get-ChildItem -Path $d -Filter *.png -File | ForEach-Object { Copy-Item $_.FullName (Join-Path screens $_.Name) -Force } }
          }
          $n = (Get-ChildItem screens -Filter *.png -ErrorAction SilentlyContinue).Count
          Write-Host "$n screens collected"

      - name: Upload screen gallery
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screen-gallery
          path: screens/*.png
          if-no-files-found: ignore
          retention-days: 7

